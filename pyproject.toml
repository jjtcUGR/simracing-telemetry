[project]
name = "simracing-telemetry"
version = "0.2.0"
description = "Backend Cloud-Native de análisis de telemetría para sim-racing"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integracion: pruebas que necesitan MongoDB y Redis reales (MONGO_URL y REDIS_URL)",
]
